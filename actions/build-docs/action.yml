name: Build plugin docs (shipyard)
description: >-
  Render a plugin's docs/ from its sources and publish its declared resource
  paths alongside them, leaving the tree ready to upload as a Pages artifact.

# Step-level counterpart to .github/workflows/deploy-docs.yml, which calls this
# and adds the Pages upload. A caller that already owns its deploy job uses this
# directly; one that just wants "publish my docs" uses the workflow.

inputs:
  resources:
    description: >-
      Newline-separated paths, relative to the plugin root, whose contents are
      copied into the published tree — the art a docs page references from
      outside docs/. A directory flattens to the docs root, so assets/hero.svg
      is reachable as hero.svg. Empty uses shipyard's default (assets).
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: '3.x'
    - run: pip install pyyaml
      shell: bash
    - name: Render docs from source
      run: python3 -m shipyard build-docs
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/../../src
        # By environment, not a run: interpolation — a workflow input expanded
        # into a shell script is a script-injection vector.
        SHIPYARD_RESOURCES: ${{ inputs.resources }}
