name: Preview (shipyard)

# Reusable gate: dry-run a plugin's projection (plugin.yml/hooks.yml → their
# generated artifacts) on push / pull_request. It does NOT fail when the
# committed artifacts trail their source — that gap is expected between releases
# (the release workflow regenerates and commits them back). It fails only when
# the source itself is malformed or missing required input, i.e. the projection
# couldn't run. On success it posts a diff of the pending projection to the job
# summary so reviewers see what release will apply.

on:
  workflow_call:
    inputs:
      cli-build:
        description: >-
          Command that builds the CLI declared in plugin.yml's `cli:` block,
          run before its grammar is checked. Only needed when `invoke` points at
          a build output (`node dist/cli.js`); a CLI run straight from source
          needs nothing here.
        type: string
        required: false
        default: ''

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONPATH: .shipyard/src
    steps:
      - name: Check out the plugin
        uses: actions/checkout@v6
      - name: Check out shipyard tooling
        uses: actions/checkout@v6
        with:
          repository: chris-peterson/shipyard
          ref: v1
          path: .shipyard
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: pip install pyyaml
      - name: Validate source and preview pending projection
        run: python3 -m shipyard generate --dry-run

      - name: Build the declared CLI
        if: inputs.cli-build != ''
        run: ${{ inputs.cli-build }}

      # Unlike the projection above, this one does gate. The committed artifacts
      # are expected to trail their source between releases, but a CLI's grammar
      # is its public contract: a renamed flag has to be visible in the diff of
      # the change that renamed it. No-ops for a plugin that declares no `cli:`.
      - name: Check the CLI's grammar against its committed manifest
        run: python3 -m shipyard gen-cli-manifest --check
