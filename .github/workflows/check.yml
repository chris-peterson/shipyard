name: Check (shipyard)

# Reusable gate: verify a plugin's committed generated artifacts still match its
# source. Catches a plugin.json left stale after a plugin.yml edit, or a
# suite.describe that drifted from the skills/rules/hooks it's derived from.
# A plugin calls it from CI on push / pull_request.

on:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .shipyard/src
    steps:
      - name: Check out the plugin
        uses: actions/checkout@v6
      - name: Check out shipyard tooling
        uses: actions/checkout@v6
        with:
          repository: chris-peterson/shipyard
          ref: main
          path: .shipyard
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: pip install pyyaml
      - name: Verify generated artifacts match source
        run: python3 -m shipyard check
