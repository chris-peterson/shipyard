name: Release (shipyard)

# The dispatched release, for plugins still on it. `shipyard release` supersedes
# it: same ordering, run from the operator's checkout, where the version, the
# body, and every refusal are visible before the first write instead of in a
# finished run. A plugin converts by replacing its release.yml with the
# `release: published` caller of notify-marketplace.yml, described in
# docs/releasing.md.
#
# A plugin calls this from its own release.yml under a `workflow_dispatch` whose
# only input is the bump level. It derives the next version from plugin.yml,
# retitles CHANGELOG.md's `## Unreleased` section to it, regenerates the
# artifacts, commits, **then** tags that commit, publishes the release from the
# section it just wrote, and dispatches the marketplace rebuild. The plugin name
# comes from the caller's repository, so nothing here is plugin-specific.
#
# The order is the point. The trigger used to be `release: published`, so a human
# cut the tag before this ran and the bump commit always landed *after* the tag
# naming it — plugin.json at the tag reported the previous version. Deriving the
# version here means the tag is cut from a commit that already carries it.
#
# Notes come from CHANGELOG.md, committed before the dispatch — reading what
# landed is what tells you the bump, so the notes and the level are one judgment.
# Nothing but shipyard supplies a heading, so the duplicate-heading class the
# release body used to produce is unreachable rather than tolerated.
#
# The caller must pass `secrets: inherit` so MARKETPLACE_DISPATCH_TOKEN — a token
# allowed to repository_dispatch to chris-peterson/claude-marketplace — reaches
# this workflow (the default GITHUB_TOKEN cannot dispatch across repositories).

on:
  workflow_call:
    inputs:
      bump:
        description: How far to advance the version (major, minor, or patch).
        required: true
        type: string
    secrets:
      MARKETPLACE_DISPATCH_TOKEN:
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # shipyard is fetched by the checkout below and run in place — no install.
      PYTHONPATH: .shipyard/src
    steps:
      - name: Check out the plugin (main)
        uses: actions/checkout@v6
        with:
          ref: main

      # Like the pin in deploy-docs.yml, this ref names the line this file is on
      # rather than the one the caller pinned, and changes when a new line is cut.
      # It matters more here: with two majors live, a caller at @v2 would run v1's
      # generators over its sources during a release.
      - name: Check out shipyard tooling
        uses: actions/checkout@v6
        with:
          repository: chris-peterson/shipyard
          ref: v2
          path: .shipyard

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: pip install pyyaml
        shell: bash

      - name: Derive the version and retitle the notes
        id: rel
        shell: bash
        env:
          # By environment, not a run: interpolation — a workflow input expanded
          # into a shell script is a script-injection vector.
          BUMP: ${{ inputs.bump }}
          NOTES: ${{ runner.temp }}/notes.md
        run: python3 -m shipyard stage-release --bump "$BUMP" --notes-file "$NOTES" >> "$GITHUB_OUTPUT"

      # A backstop, not the writer: the projection job already committed these
      # when the source changed, so a release ordinarily finds nothing to resync.
      # It runs after the bump so plugin.json carries the new version.
      - name: Resync generated artifacts
        shell: bash
        run: python3 -m shipyard generate

      - name: Commit the bump
        shell: bash
        env:
          VERSION: ${{ steps.rel.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -A for the same reason actions/project uses it: which paths are
          # projections is shipyard's to change, and a named list here would make
          # each new one a change to every caller. Ignored files stay out.
          #
          # .shipyard has to stay out. This job parks shipyard's own checkout
          # there, inside the plugin's working tree, and actions/checkout leaves a
          # .git in it, so an unqualified -A records it as a gitlink and commits a
          # submodule the plugin never declared. `:!` is git's exclude pathspec
          # magic, not a regex, and a bare directory name covers everything under
          # it: the add is the whole tree minus .shipyard/.
          # https://git-scm.com/docs/gitglossary#def_pathspec
          git add -A -- . ':!.shipyard'
          git commit -m "Release v$VERSION"
          git push origin HEAD:main

      - name: Tag that commit
        shell: bash
        env:
          VERSION: ${{ steps.rel.outputs.version }}
        run: |
          set -euo pipefail
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Publish the release from the changelog section
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.rel.outputs.version }}
          NOTES: ${{ runner.temp }}/notes.md
        run: |
          set -euo pipefail
          gh release create "v$VERSION" --title "v$VERSION" --notes-file "$NOTES"

      - name: Notify bridge.ai marketplace
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_DISPATCH_TOKEN }}
          PLUGIN: ${{ github.event.repository.name }}
          VERSION: ${{ steps.rel.outputs.version }}
        run: |
          set -euo pipefail
          gh api repos/chris-peterson/claude-marketplace/dispatches \
            -f event_type=plugin-released \
            -f "client_payload[plugin]=$PLUGIN" \
            -f "client_payload[tag]=v$VERSION"
