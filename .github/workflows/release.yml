name: Release (shipyard)

# Reusable release workflow. A plugin calls it from its own release.yml on
# `release: published`; the release tag (v<version>) is the version. This
# resyncs generated artifacts from source, writes the version into plugin.yml on
# main, regenerates plugin.json, proxies the release notes into CHANGELOG.md,
# pushes, and dispatches the marketplace rebuild. The plugin name is taken from
# the caller's repository, so nothing here is plugin-specific.
#
# The caller must pass `secrets: inherit` so MARKETPLACE_DISPATCH_TOKEN — a token
# allowed to repository_dispatch to chris-peterson/claude-marketplace — reaches
# this workflow (the default GITHUB_TOKEN cannot dispatch across repositories).

on:
  workflow_call:
    secrets:
      MARKETPLACE_DISPATCH_TOKEN:
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # shipyard is fetched by the checkout below and run in place — no install.
      PYTHONPATH: .shipyard/src
    steps:
      - name: Resolve version from release tag
        id: ver
        run: |
          tag="${{ github.event.release.tag_name }}"
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag '$tag' is not a vMAJOR.MINOR.PATCH version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check out the plugin (main)
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Check out shipyard tooling
        uses: actions/checkout@v6
        with:
          repository: chris-peterson/shipyard
          ref: actions
          path: .shipyard

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: pip install pyyaml

      - name: Resync generated artifacts + build docs (gate the release)
        run: |
          python3 -m shipyard gen-describe
          python3 -m shipyard build-docs

      - name: Bump version and regenerate plugin.json
        run: |
          sed -i -E "s/^version: .*/version: ${{ steps.ver.outputs.version }}/" plugin.yml
          python3 -m shipyard gen-plugin-json

      - name: Proxy release notes into CHANGELOG.md
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          BODY: ${{ github.event.release.body }}
        run: python3 -m shipyard changelog

      - name: Commit and push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin.yml .claude-plugin/plugin.json CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changes to commit (version ${{ steps.ver.outputs.version }} already current)."
          else
            git commit -m "Release v${{ steps.ver.outputs.version }}"
            git push origin HEAD:main
          fi

      - name: Notify bridge.ai marketplace
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_DISPATCH_TOKEN }}
        run: |
          gh api repos/chris-peterson/claude-marketplace/dispatches \
            -f event_type=plugin-released \
            -f "client_payload[plugin]=${{ github.event.repository.name }}" \
            -f "client_payload[tag]=${{ github.event.release.tag_name }}"
