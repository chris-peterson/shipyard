name: Deploy docs

# shipyard's own docs site — a static docsify site under docs/, published to
# GitHub Pages. (Distinct from deploy-docs.yml, which is the reusable workflow
# plugins call to build *their* docs.)

on:
  push:
    branches: [main]
    paths: ['docs/**']
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
        with:
          # enable Pages (source: GitHub Actions) on first run, so no manual
          # repo setting is needed to bring the docs site up
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5
