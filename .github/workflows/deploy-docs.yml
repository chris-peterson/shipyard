name: Deploy docs (shipyard)

# Reusable docs deploy. A plugin calls it from its own deploy-docs.yml on push to
# main, and release.yml calls it with the tag it just cut. shipyard renders docs/
# from the plugin's sources (skills/rules/… + suite.json) via actions/build-docs,
# then publishes docs/ to GitHub Pages.
#
# GitHub Pages needs pages: write + id-token: write. Reusable-workflow permissions
# are capped by the caller's token, so the caller must grant those at its top
# level (its deploy-docs.yml and release.yml do).
#
# Build and deploy are separate jobs, and the artifact is named for the attempt.
# deploy-pages looks the artifact up through the API, and in the same job as the
# upload that lookup can run before the artifact is listed ("No artifacts named
# github-pages"). A re-run of the failed job then finds the first attempt's
# artifact as well as its own ("Multiple artifacts named github-pages"), so a
# fixed name can't be re-run at all. The job boundary gives the upload time to
# land, one retry covers a lookup that still misses, and a name per attempt
# leaves a re-run nothing to collide with.

on:
  workflow_call:
    inputs:
      ref:
        description: The ref to build from. Empty builds the commit that triggered the caller.
        required: false
        type: string
        default: ''

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ARTIFACT: github-pages-${{ github.run_attempt }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the plugin
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/configure-pages@v6
      # Pinned rather than tracking the ref the caller pinned this workflow at:
      # `uses:` takes no expression, so ${{ github.ref }} isn't available here.
      # The pin therefore names the line this file is on, and changes when a new
      # line is cut: the copy at the v1 tag reads @v1, and this one reads @v2.
      # With two majors live, a caller at @v2 would otherwise silently get v1's
      # build-docs.
      - uses: chris-peterson/shipyard/actions/build-docs@v2
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
          name: ${{ env.ARTIFACT }}

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          artifact_name: ${{ env.ARTIFACT }}
      - name: Wait for the artifact to be listed
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ env.ARTIFACT }}
