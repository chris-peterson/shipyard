name: Deploy docs (shipyard)

# Reusable docs deploy. A plugin calls it from its own deploy-docs.yml on push to
# main. shipyard renders docs/ from the plugin's sources (skills/rules/… +
# suite.json) via actions/build-docs, then publishes docs/ to GitHub Pages.
#
# GitHub Pages needs pages: write + id-token: write. Reusable-workflow permissions
# are capped by the caller's token, so the caller must grant those at its top
# level (its deploy-docs.yml does).

on:
  workflow_call:
    inputs:
      resources:
        description: >-
          Newline-separated paths whose contents are published alongside docs/,
          for art a page references from outside it. Empty uses the default
          (assets). Forwarded to actions/build-docs.
        required: false
        type: string
        default: ''

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the plugin
        uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      # Pinned rather than tracking the ref the caller pinned this workflow at:
      # `uses:` takes no expression, so ${{ github.ref }} isn't available here.
      # Move both together when v1 advances.
      - uses: chris-peterson/shipyard/actions/build-docs@v1
        with:
          resources: ${{ inputs.resources }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5
