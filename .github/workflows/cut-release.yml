name: Cut release (shipyard)

# shipyard's own release. (Distinct from release.yml, the reusable workflow
# plugins call to release *themselves*.) shipyard runs the same shape it gives
# them, so the flow is exercised here before a plugin depends on it.
#
# The version is derived from a bump level rather than read off a tag, which is
# what puts the bump commit *before* the tag that names it. Cutting the tag first
# is why a plugin's plugin.json at its own tag reported the previous version.
#
# Notes come from CHANGELOG.md's `## Unreleased` section. No section, or an empty
# one, fails the run — a tag naming a version whose changelog entry says nothing
# can't be fixed without moving the tag.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: How far to advance the version
        required: true
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          # The major-alias move below reads existing tags.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: pip install pyyaml
        shell: bash

      - name: Derive the version and retitle the notes
        id: rel
        shell: bash
        env:
          PYTHONPATH: src
          # By environment, not a run: interpolation. The input is a `choice`, so
          # its values are already constrained, but the rule is the rule.
          BUMP: ${{ inputs.bump }}
          NOTES: ${{ runner.temp }}/notes.md
        run: python3 -m shipyard release --bump "$BUMP" --notes-file "$NOTES" >> "$GITHUB_OUTPUT"

      - name: Refuse a major alias that is also a branch
        shell: bash
        env:
          VERSION: ${{ steps.rel.outputs.version }}
        run: |
          set -euo pipefail
          major="v${VERSION%%.*}"
          if git ls-remote --exit-code --heads origin "$major" >/dev/null 2>&1; then
            echo "::error::A branch named $major exists, and this run would also" \
                 "create a tag named $major. Which one a consumer's 'uses: …@$major'" \
                 "resolves to is not something to leave to chance — delete the" \
                 "branch first, then re-run." >&2
            exit 1
          fi

      - name: Commit the bump
        shell: bash
        env:
          VERSION: ${{ steps.rel.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml CHANGELOG.md
          git commit -m "Release v$VERSION"
          git push origin HEAD:main

      - name: Tag that commit, and move the major alias onto it
        shell: bash
        env:
          VERSION: ${{ steps.rel.outputs.version }}
        run: |
          set -euo pipefail
          # The tag names the commit that already carries the version, which is
          # the whole point of deriving it above rather than reading it off a tag.
          git tag "v$VERSION"
          git push origin "v$VERSION"
          # vX follows the newest release on its line, so a caller pinning @v2
          # tracks it without editing anything. Immutable vX.Y.Z stays available
          # for a caller that wants to pin exactly.
          major="v${VERSION%%.*}"
          git tag -f "$major"
          git push -f origin "$major"

      - name: Publish the release from the changelog section
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.rel.outputs.version }}
          NOTES: ${{ runner.temp }}/notes.md
        run: |
          set -euo pipefail
          gh release create "v$VERSION" --title "v$VERSION" --notes-file "$NOTES"
