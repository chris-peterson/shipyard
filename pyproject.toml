[project]
name = "shipyard"
version = "0.0.0"
description = "Consistent build tooling for chris-peterson's Claude Code plugins"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6",
]

[project.scripts]
shipyard = "shipyard.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
