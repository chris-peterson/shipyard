[project]
name = "shipyard"
# The version CI bumps at release, the way it bumps a plugin's `plugin.yml`.
# Seeded at 1.0.0 for the line the `v1` tag already names, so the first release
# off this branch is the major that produces `v2.0.0`.
version = "2.4.0"
description = "Consistent build tooling for chris-peterson's Claude Code plugins"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4"]

[project.scripts]
shipyard = "shipyard.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
