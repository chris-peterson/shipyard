# The Claude Code plugin shipyard bundles. It versions on its own line, separate
# from the build tooling's (pyproject.toml): bump `version:` here when the
# plugin's skills or the CLI verbs they drive change. `shipyard release`
# regenerates .claude-plugin/plugin.json from this file.

name: shipyard
version: 0.1.0
description: "Skills for a marketplace of Claude Code plugins built with shipyard: list what bridge.ai ships, onboard a plugin, and see what it still lacks."
author: chris-peterson
repository: https://github.com/chris-peterson/shipyard
license: MIT
keywords: [plugins, marketplace, catalog, onboarding, claude-code]

marketplace:
  homepage: https://chris-peterson.github.io/shipyard/#/
